<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Notes · 录屏测试界面</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101416;color:#edf1ed;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}button,input{font:inherit}button{cursor:pointer}header{padding:30px 28px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff12}header b{letter-spacing:3px;font-size:13px}header span{color:#9db49c;font-size:12px}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{padding:38px 24px;border-right:1px solid #ffffff12;color:#85908b;font-size:13px}aside div{padding:14px 12px;border-radius:8px}aside .sel{background:#ffffff0b;color:#d4e8c6}main{max-width:1050px;padding:45px 48px 70px}small{color:#adc0a8;font-size:11px;letter-spacing:2px}h1{font-size:52px;line-height:1.05;letter-spacing:-2px;font-weight:500;margin:18px 0 14px}p{color:#97a29a;line-height:1.7;font-size:14px}.summary{display:flex;gap:45px;margin:30px 0 32px}.summary strong{font-size:29px;font-weight:400;display:block}.summary span{font-size:11px;color:#8c998f;display:block;margin-top:7px}input{width:100%;border:1px solid #ffffff16;background:#1c2223;color:#e4e9e3;padding:13px 15px;border-radius:8px;outline-color:#d3e3c0}nav{display:flex;gap:20px;margin:25px 0 12px;border-bottom:1px solid #ffffff16}nav button{background:none;border:0;color:#8d9b92;padding:12px 0;font-size:13px}nav button[aria-selected=true]{color:#d6e7be;border-bottom:2px solid #d6e7be}.note{border-bottom:1px solid #ffffff14;padding:23px 0;display:flex;gap:20px}.date{color:#77887a;font-size:12px;width:45px;padding-top:3px;flex-shrink:0}.note h2{font-size:19px;font-weight:500;margin:0 0 9px}.note p{font-size:12px;margin:0;color:#899b8e}.note button{margin-left:auto;align-self:center;border:1px solid #ffffff24;color:#b2c29e;border-radius:50%;background:none;width:30px;height:30px;font-size:17px;flex-shrink:0}.note button[aria-pressed=true]{background:#ccdfb6;color:#192019;border-color:#ccdfb6}.empty{padding:30px 0;color:#88988d}footer{font-size:10px;color:#5f7164;margin-top:30px}body:after{content:'';position:fixed;pointer-events:none;inset:0;background:radial-gradient(ellipse at 100% 0,#8ca67c0e,transparent 50%)}
@media(max-width:600px){.app{display:block}aside{display:none}header{padding:64px 24px 22px}main{padding:36px 24px 48px}h1{font-size:46px}.summary{gap:40px;margin:27px 0}.note{gap:8px;padding:23px 0}.date{width:36px}header span{font-size:10px}}
</style>
<header><b>STUDIO NOTES</b><span>CREATIVE JOURNAL</span></header><div class="app"><aside><div class="sel">项目记录</div><div>素材整理</div><div>归档</div></aside><main>
<small>SEPTEMBER · 2026</small><h1>项目记录</h1><p>整理镜头、素材与每一次修改。</p><section class="summary"><div><strong>08</strong><span>项目记录</span></div><div><strong id="saved-count">02</strong><span>已标记</span></div><div><strong>04</strong><span>本周更新</span></div></section>
<input aria-label="搜索记录" placeholder="搜索记录"><nav><button aria-selected="true" data-tab="all">全部记录</button><button aria-selected="false" data-tab="saved">已标记</button></nav><div id="notes"></div><footer>INTERACTIVE FIXTURE · 示例界面</footer>
</main></div><script>
const items=[['09.10','镜头节奏','开场、特写与设备展示。',true],['09.09','界面录屏','保留输入与滚动的连续过程。',false],['09.08','材质测试','金属边框、哑光外壳与反射。',true],['09.07','画面构图','为标题、正文和字幕留出空间。',false],['09.06','配音整理','术语、停顿与音量复核。',false],['09.05','灯光设置','主光与轮廓光的位置。',false],['09.04','输出检查','画面尺寸、帧率与编码。',false],['09.03','素材归档','保存确认后的文稿和画面。',false]];
let tab='all',query='';
function draw(){const visible=items.filter(x=>(tab==='all'||x[3])&&x[1].includes(query));document.querySelector('#notes').replaceChildren(...visible.map(x=>{let row=document.createElement('article');row.className='note';let date=document.createElement('div');date.className='date';date.textContent=x[0];let text=document.createElement('div'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=x[1];p.textContent=x[2];text.append(h,p);let b=document.createElement('button');b.textContent=x[3]?'✓':'+';b.setAttribute('aria-label','标记'+x[1]);b.setAttribute('aria-pressed',String(x[3]));b.onclick=()=>{x[3]=!x[3];draw()};row.append(date,text,b);return row}));document.querySelector('#saved-count').textContent=String(items.filter(x=>x[3]).length).padStart(2,'0')}
document.querySelector('input').oninput=e=>{query=e.target.value;draw()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));draw()});draw();
</script></html>
